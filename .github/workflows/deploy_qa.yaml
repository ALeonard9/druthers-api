# TEMPLATE - copy to druthers-api/.github/workflows/deploy_qa.yaml
name: Deploy to QA

# QA deploys are main-driven (see druthers-infra/docs/PROMOTION.md): every
# push to main builds the image into the QA project's Artifact Registry,
# runs alembic migrations against the Neon qa branch, and rolls the
# druthers-api service in the QA project. Prod is untouched - it deploys
# only on releases via deploy_cloud_run.yaml.
# No-ops until the GCP_*_QA repo variables exist (docs/QA-ENVIRONMENT.md).

on:
  push:
    branches: [main]

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER_QA != ''
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_QA }}/druthers/druthers-api:main-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_QA }}
          service_account: ${{ vars.GCP_DEPLOY_SA_QA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build --build-arg GIT_SHA="${{ github.sha }}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run database migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_QA }}
          ENV: qa
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL_QA secret not set - skipping migrations."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install -r requirements/base.txt
          alembic upgrade head
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Mirrors the prod pipeline: backfills run between the migration and the
      # roll so QA exercises the same sequence prod will. If QA skipped these,
      # QA would show the unbackfilled state prod is specifically avoiding -
      # which is exactly the bug QA exists to catch.
      - name: Backfill catalog data
        if: steps.migrate.outputs.ran == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_QA }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # See the prod workflow: without this, enrich_books cannot reach the
          # books Open Library has no record of, and reports them as misses.
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          ENV: qa
        run: |
          set -euo pipefail
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is not set. backfill_tmdb cannot"
            echo "::error::resolve any movie and QA would deploy with an"
            echo "::error::unkeyed catalog. Add the secret and re-run."
            exit 1
          fi
          python -m app.migration.backfill_tmdb
          python -m app.migration.backfill_covers
          python -m app.migration.enrich_movies
          python -m app.migration.enrich_books
          if [ -n "$TWITCH_CLIENT_ID" ] && [ -n "$TWITCH_CLIENT_SECRET" ]; then
            python -m app.migration.enrich_games
          else
            echo "::warning::TWITCH_CLIENT_ID/SECRET not set - skipping"
            echo "::warning::enrich_games (see the prod workflow)."
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy druthers-api \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID_QA }}
