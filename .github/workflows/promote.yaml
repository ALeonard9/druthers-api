name: Promote image

# Promote a tested+scanned artifact between environments by DIGEST - never rebuilds.
# See www.aleonard.us-docker/docs/PROMOTION.md. Copy this file to -web / -mcp
# (only IMAGE_NAME differs, which is derived from the repo automatically).

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag to promote (the tested artifact, e.g. dev or qa)'
        default: 'dev'
        required: true
      target:
        description: 'Target environment'
        type: choice
        options: [qa, prod]
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    # Maps to a GitHub Environment; add a required reviewer on `prod` so this
    # job pauses for manual approval before promoting to production.
    environment: ${{ inputs.target }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source digest
        id: src
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${IMAGE_NAME}:${SOURCE_TAG}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoting ${IMAGE_NAME}@${digest} → :${TARGET}"

      - name: Re-tag the exact digest to the target (no rebuild)
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_DIGEST: ${{ steps.src.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${TARGET}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${TARGET}-${{ github.run_number }}" \
            "${REGISTRY}/${IMAGE_NAME}@${SOURCE_DIGEST}"

      - name: Record promotion
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET: ${{ inputs.target }}
          SOURCE_DIGEST: ${{ steps.src.outputs.digest }}
        run: |
          {
            echo "### Promoted \`${SOURCE_TAG}\` → \`${TARGET}\`"
            echo ""
            echo "- Image: \`${IMAGE_NAME}@${SOURCE_DIGEST}\`"
            echo "- Approved by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
