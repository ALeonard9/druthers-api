name: Deploy to Cloud Run

# Prod deploys are release-driven (see druthers-infra/docs/PROMOTION.md):
# publishing a vX.Y.Z release builds the image into Artifact Registry,
# runs alembic migrations against Neon, backfills any data the new schema
# needs, and rolls the druthers-api service.
# No-ops until the GCP_* repo variables exist (set by the launch runbook).
#
# Order matters: backfills run *between* the migration and the Cloud Run
# roll, so the data a release depends on is in place before the code that
# reads it goes live. Running them after the roll would leave a window where
# the new code queries columns the backfill hasn't filled yet — for #163 that
# window showed every movie as "not tracked" in search.

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/druthers/druthers-api:${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run database migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENV: prod
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret not set — skipping migrations."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install -r requirements/base.txt
          alembic upgrade head
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Every step here is idempotent and resumable: they only touch rows that
      # still need work, so re-running on every release is a near-no-op once
      # the catalog is keyed and enriched. That is deliberate — it makes a
      # release self-contained instead of depending on someone remembering to
      # run these by hand afterwards. The one-off scripts that were *not*
      # wired in are exactly the ones that regressed in prod: movie ranks went
      # back to 0-based and Top 5 rows lost their years.
      - name: Backfill catalog data
        if: steps.migrate.outputs.ran == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ENV: prod
        run: |
          set -euo pipefail
          # A missing key is not a soft failure here: resolve_tmdb_id would
          # return None for every row, the script would report "0 resolved"
          # and exit 0, and the deploy would ship a catalog whose search
          # badges are all blank. Fail loudly instead.
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is not set. backfill_tmdb cannot"
            echo "::error::resolve any movie and the release would deploy with"
            echo "::error::an unkeyed catalog. Add the secret and re-run."
            exit 1
          fi
          python -m app.migration.backfill_tmdb
          python -m app.migration.backfill_covers
          # Pure SQL, no upstream calls: shift any shelf still sitting on the
          # legacy 0-based ranks onto the API's 1-based contract.
          python -m app.migration.backfill_rank_base --all-users
          # These fill `year` (among other detail). Throttled, so the first
          # release after a large import is slow; every release after that
          # has almost nothing left to do.
          python -m app.migration.enrich_movies
          python -m app.migration.enrich_books
          # Unlike TMDB, Twitch creds are optional here: without them games
          # simply keep their current detail. Warn rather than block a release
          # on a shelf-sized gap.
          if [ -n "$TWITCH_CLIENT_ID" ] && [ -n "$TWITCH_CLIENT_SECRET" ]; then
            python -m app.migration.enrich_games
          else
            echo "::warning::TWITCH_CLIENT_ID/SECRET not set — skipping"
            echo "::warning::enrich_games. Game years and genres will stay"
            echo "::warning::blank until the secrets are added."
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy druthers-api \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }}
