name: security
on:
  pull_request: { branches: [main] }
  push:         { branches: [main] }
  schedule:     [{ cron: "0 6 * * 1" }]   # weekly re-scan of main
jobs:
  scan:
    uses: ALeonard9/.github/.github/workflows/security-reusable.yml@main
    with:
      stack: python
      # trivy's pip analyzer only matches a file named requirements.txt;
      # without this it scans zero dependencies and still reports green.
      file_patterns: 'pip:requirements/.*\.txt'
      builds_image: true
      block: true            # enforced - findings resolved
      severity: "CRITICAL,HIGH"
    # security-reusable.yml declares no `secrets:` in its workflow_call and
    # never references `secrets.*` (it uses the auto-provided github.token),
    # so there is nothing to pass through here.
    permissions:
      contents: read
      security-events: write
      issues: write
      actions: read
