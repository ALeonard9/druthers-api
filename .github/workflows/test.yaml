name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ENV: github

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements/test.txt

    - name: Run Pytest with Coverage Ratchet
      run: |
          source .venv/bin/activate
          FLOOR=$(cat .coverage-baseline || echo 55)
          ./.venv/bin/pytest --cov=./ --cov-fail-under=$FLOOR --cov-report=html:.reports/coverage --cov-report=term --html=.reports/junit/test-results.html

    - name: Fail on any pytest warning
      run: |
          source .venv/bin/activate
          ./.venv/bin/pytest -q -W error

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results
        path: .reports/junit/test-results.html
        retention-days: 60

    - name: Upload Coverage Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage-report
        path: .reports/coverage
        retention-days: 60
