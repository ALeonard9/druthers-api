name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements/dev.txt

    # A pre-commit hook can be skipped with --no-verify, and pre-commit.ci
    # cannot run the venv-backed hooks at all, so the openapi-json hook alone
    # is not enough to keep the spec honest. --check writes nothing.
    - name: openapi.json is current
      run: |
          source .venv/bin/activate
          python scripts/generate_openapi.py --check

    - name: Run Black
      run: |
          source .venv/bin/activate
          black --skip-string-normalization .

    - name: Run Pylint
      run: |
          source .venv/bin/activate
          ./.venv/bin/pylint . --ignore=.venv --disable=too-few-public-methods

    - name: Validate OpenAPI Spec
      run: |
          source .venv/bin/activate
          openapi-spec-validator openapi.json
