fail_fast: true
default_stages: [pre-commit]   # existing hooks run per-commit; tests run pre-push (below)

# pre-commit.ci (hosted app) keeps hook versions current and auto-fixes on PRs.
# Skip hooks that need the local project venv - they can't run in the hosted CI.
ci:
  autoupdate_schedule: weekly
  skip: [pylint, pytest-changed, openapi-json]

repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-json
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: debug-statements
  - id: check-added-large-files
    args: [--maxkb=200]
  - id: double-quote-string-fixer
  - id: mixed-line-ending
  - id: name-tests-test
  - id: no-commit-to-branch
- repo: https://github.com/python-openapi/openapi-spec-validator
  rev: 0.9.0
  hooks:
  - id: openapi-spec-validator
    files: "openapi\\.json"
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    - id: black
      args: [--skip-string-normalization]
      language_version: python3.14
- repo: local
  hooks:
  # Regenerate openapi.json whenever the app changes. openapi-spec-validator
  # above only proves the file is well-formed - it validated a spec that was
  # missing five real routes for months. This is the hook that keeps it true.
  # Writes and fails, like black does, so the fresh file gets re-staged.
  - id: openapi-json
    name: openapi.json is current
    entry: ./.venv/bin/python scripts/generate_openapi.py
    language: system
    pass_filenames: false
    files: ^(app/|scripts/generate_openapi\.py)
  - id: pylint
    name: pylint
    entry: ./.venv/bin/pylint
    language: system
    types: [python]
    args: [--ignore=.venv, --disable=too-few-public-methods]
  # Tests run at PRE-PUSH (not per-commit) and only for what changed
  # (testmon maps coverage -> affected tests). CI runs the full suite.
  - id: pytest-changed
    name: pytest (changed only, pre-push)
    entry: ./.venv/bin/pytest --testmon -q
    language: system
    stages: [pre-push]
    pass_filenames: false
    always_run: true
