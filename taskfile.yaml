version: '3'

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task -l
  db:
    desc: "Build druthers Docker environment"
    vars:
      ENV: '{{default "dev" .CLI_ARGS}}'
    cmds:
      - docker compose -f dc-{{.ENV}}.yml --env-file env/{{.ENV}}.env build --no-cache
  du:
    desc: "Launch druthers Docker environment (default: dev). Always rebuilds the API image so it never silently serves stale code (api#232)."
    vars:
      ENV: '{{default "dev" .CLI_ARGS}}'
    cmds:
      - GIT_SHA=$(git rev-parse HEAD) docker compose -f dc-{{.ENV}}.yml --env-file env/{{.ENV}}.env up -d --build

  dd:
    desc: "Stop druthers Docker environment"
    vars:
      ENV: '{{default "dev" .CLI_ARGS}}'
    cmds:
      - docker compose -f dc-{{.ENV}}.yml --env-file env/{{.ENV}}.env down

  dr:
    desc: "Rebuild druthers Docker environment"
    vars:
      ENV: '{{default "dev" .CLI_ARGS}}'
    deps: [dd]
    cmds:
      - task: db
        vars: { ENV: '{{.ENV}}' }
      - task: du
        vars: { ENV: '{{.ENV}}' }

  dev:up:
    desc: "Bring local dev up in the order that actually works: containers, migrations, then the API restart that lets the seed admin land. Follow with `task seed:dev`."
    cmds:
      - task: du
      - |
        printf 'waiting for postgres'
        for _ in $(seq 1 60); do
          if docker compose -f dc-dev.yml --env-file env/dev.env exec -T postgres-dev pg_isready -q 2>/dev/null; then
            printf ' ok\n'; exit 0
          fi
          printf '.'; sleep 1
        done
        printf '\npostgres never became ready\n' >&2; exit 1
      - task: migrate
      # The API bootstraps the seed admin during startup, so on a fresh volume
      # it runs before the users table exists and silently gives up. Every
      # later step then fails on a missing admin -- `task seed:dev` bails with
      # "No local user with email ...", and there is nothing to sign in as.
      # Restarting after the migration is what makes the rest of the session
      # work, and it is the step nobody remembers.
      - docker compose -f dc-dev.yml --env-file env/dev.env restart api-dev
      - |
        printf 'waiting for api'
        for _ in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:8000/docs; then
            printf ' ok\n'; exit 0
          fi
          printf '.'; sleep 1
        done
        printf '\napi never answered on :8000\n' >&2; exit 1
      - "echo ''"
      - "echo 'dev is up — API on http://localhost:8000'"
      - "echo 'Seed the dev cast with:  task seed:dev'"

  migrate:
    desc: "Apply Alembic migrations to the running stack's Postgres (default: dev)"
    vars:
      ENV: '{{default "dev" .CLI_ARGS}}'
    cmds:
      # Runs inside the compose network, not on the host, and that is the
      # whole point. On the host nothing sets ENV, so Settings.env falls back
      # to 'local' and sqlalchemy_database_url quietly resolves to SQLite:
      # migrations then "succeed" against a stray aleonard-api-local.db while
      # the real Postgres stays un-migrated. The only reason anyone notices is
      # that SQLite rejects ALTER CONSTRAINT a dozen revisions in.
      #
      # CI and prod do not come through here -- deploy_cloud_run.yaml and
      # deploy_qa.yaml run `alembic upgrade head` directly with DATABASE_URL
      # and ENV already set, which is why this can be dev-shaped.
      - docker compose -f dc-{{.ENV}}.yml --env-file env/{{.ENV}}.env run --rm api-{{.ENV}} alembic upgrade head

  revision:
    desc: "Autogenerate a new Alembic migration. Usage: task revision -- \"message\""
    vars:
      MSG: '{{default "migration" .CLI_ARGS}}'
    cmds:
      - alembic revision --autogenerate -m "{{.MSG}}"

  backfill:tmdb:
    desc: "Key existing movies onto TMDB ids + re-point posters (run before enrich:movies)"
    cmds:
      - python -m app.migration.backfill_tmdb {{.CLI_ARGS}}

  backfill:covers:
    desc: "Re-point legacy book covers to Open Library, upgrade IGDB cover sizes"
    cmds:
      - python -m app.migration.backfill_covers {{.CLI_ARGS}}

  enrich:movies:
    desc: "Backfill TMDB detail for existing movies (throttled, resumable)"
    cmds:
      - python -m app.migration.enrich_movies

  enrich:tv:
    desc: "Backfill TVMaze detail + episodes for existing TV shows (throttled, resumable)"
    cmds:
      - python -m app.migration.enrich_tv

  enrich:books:
    desc: "Backfill Google Books detail for existing books (throttled, resumable)"
    cmds:
      - python -m app.migration.enrich_books

  enrich:games:
    desc: "Backfill IGDB detail for existing games (needs TWITCH_CLIENT_ID/SECRET)"
    cmds:
      - python -m app.migration.enrich_games

  backfill:time_to_beat:
    desc: "Backfill IGDB time-to-beat for existing games (needs TWITCH_CLIENT_ID/SECRET)"
    cmds:
      - python -m app.migration.backfill_time_to_beat

  import:orion:
    desc: "Import legacy orion (MySQL) data into druthers. Usage: task import:orion -- --dry-run"
    cmds:
      - python -m app.migration.orion_import {{.CLI_ARGS}}

  seed:dev:
    desc: "Populate local dev Postgres with real catalog data + randomized tracker state + the fixed dev cast (#313). Usage: task seed:dev -- --count 500 | --wipe"
    cmds:
      - python -m app.migration.seed_dev {{.CLI_ARGS}}

  fixtures:build:
    desc: "Refresh app/migration/fixtures/seed_*.json from TMDB/TVMaze/Open Library/IGDB (needs API keys)"
    cmds:
      - python -m app.migration.build_seed_fixtures

  gh:
    desc: "Open project repository in GitHub"
    cmds:
      - open https://github.com/aleonard9/druthers-api
    silent: true

  test:
    desc: "Run pytest"
    cmds:
      - pytest --cov=./ --cov-report=html:.reports/coverage --cov-report=term --html=.reports/junit/test-results.html

  sca:
    desc: "Run security checks on dependencies"
    cmds:
      - >
          snyk test
          --file=requirements/base.txt
          --package-manager=pip
          --severity-threshold=high
          --fail-on=patchable

  sast:
    desc: "Run static analysis on code"
    cmds:
      - >
          snyk code test
          --all-projects
          --exclude=tests
          --severity-threshold=high

  container:
    desc: "Run container security checks"
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          EXTRA_ARG="--platform=linux/amd64"
        else
          EXTRA_ARG=""
        fi
        # Build the image with the appropriate platform argument
        docker build $EXTRA_ARG -t ghcr.io/aleonard9/druthers-api:test .
        # Run Snyk container test (no need to pass EXTRA_ARG here)
        snyk container test ghcr.io/aleonard9/druthers-api:test \
          --file=Dockerfile \
          --severity-threshold=high
        docker rmi ghcr.io/aleonard9/druthers-api:test
  lz:
    desc: "Echos current landing zone"
    platforms: [darwin]
    cmds:
      - cmd: echo 'Current landing zone m3'
        platforms: ['darwin']
      - cmd: echo 'Current landing zone gs'
        platforms: ['linux']
