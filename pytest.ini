; Description: pytest configuration file
[pytest]
filterwarnings =
; starlette.testclient deprecates the httpx transport and warns on import
; whenever httpx2 is missing. httpx2 is pinned in requirements/test.txt, so a
; fresh install is clean; this filter keeps environments that predate that pin
; (the shared dev venv) warning-free too, and is inert once httpx2 is present.
; The CI warnings-as-errors step still turns any other warning into a failure.
    ignore::starlette.exceptions.StarletteDeprecationWarning
; Setting defaults for asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -n auto
